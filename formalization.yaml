# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: "Erdős 1172: GCH ordinal partition relations on ω₂ and ω₃, huge-cardinal consistency of ω₂ → (ω₁ + ω)²₂, and the ω₃ → (ω₂ + 1)²_ω step"
  description: >-
    Lean 4 formalization of Parts (ii), (iii), and (iv) of Erdős Problem 1172
    together with a countable-color partial step toward the original Part (i).
    Parts (ii) and (iii) are new mathematical results proved in ZFC + GCH
    (Cardinal.GCH): ω₃ → (ω₂ + ω₁, ω₂ + ω)² and ω₂ → (ω₁^(ω + 2) + 2, ω₁ + 2)²,
    matching Baumgartner, Hajnal, and Todorčević (1993, p. 2) and the 1999
    Budapest problem booklet [Va99, 7.87] verbatim, both previously open in the
    set-theory literature. Part (iv) gives the first formalization of the known
    relative consistency result (Laver 1982; Foreman-Hajnal 2003) for the
    ω₁ + ω case posed by Erdős and Hajnal (1974, p. 272): relative to a huge
    cardinal κ with target θ (IsHugeWithTarget κ θ, Kanamori Theorem 24.8) and
    ground GCH at and above θ, the first-order theory ZFC + GCH +
    ω₂ → (ω₁ + ω, ω₁ + ω)² (gchPart4Theory) is syntactically consistent; the
    stronger simultaneous all-target question ∀ ξ < ω₂, ω₂ → (ξ)²₂ under GCH
    remains open and is not addressed. For Part (i), erdosproblems.com/1172's
    cropped-scan binary reconstruction is omitted, and the original un-cropped
    Baumgartner-Hajnal-Todorčević (1993, p. 2) countable-color question
    ω₃ → (ω₂ + 2)²_ω under GCH remains open. In its place we publish as a
    partial step toward the original Part (i) the weaker countable-color
    relation GCH → ω₃ → (ω₂ + 1)²_ω
    (Erdos1172.erdos_1172.variants.part1_omega_two_add_one), proved via our
    < ℵ₂-complete countable-color neighborhood-ideal machinery on ω₃, which
    also follows from the Erdős-Rado theorem ([ErRa56]; [BHT93, Theorem 2.1]).
  authors:
    - Tokengrinder
  responsible_maintainers:
    - Tokengrinder
  license: Apache-2.0

sources:
  - title: "Proofs under GCH of the open Baumgartner-Hajnal-Todorčević ordinal partition relations ω₃ → (ω₂ + ω₁, ω₂ + ω)² and ω₂ → (ω₁^(ω + 2) + 2, ω₁ + 2)²"
    authors:
      - Tokengrinder
    id: "https://github.com/tokengr1nder/Erdos1172"
    type: original-proof
    location: "Erdos1172/Solution.lean (erdos_1172.parts.ii, erdos_1172.parts.iii); PROOF.md"
    relationship: other
    note: >-
      Parts (ii) and (iii) resolve two open GCH problems posed in Baumgartner,
      Hajnal, and Todorčević (1993, p. 2) and [Va99, 7.87], using neighborhood
      pattern spectra on ω₃ and transfinite Hechler ordered-trace thinning on ω₂.
      Part (iv) formalizes the known huge-cardinal consistency result of Laver
      (1982) and Foreman-Hajnal (2003) for ω₁ + ω, and
      erdos_1172.variants.part1_omega_two_add_one proves the weaker
      countable-color partial step GCH → ω₃ → (ω₂ + 1)²_ω toward the open
      original Part (i) ω₃ → (ω₂ + 2)²_ω (a step that also follows from
      Erdős-Rado / BHT93 Theorem 2.1); those prior sources use relationship:
      other below because Palomar's provenance contract requires background or
      other on companion sources when type: original-proof is present. Material
      AI involvement is recorded under automation and in PALOMAR.md.
    license: Apache-2.0
    author_endorsement: participated
  - title: "Extensions of the Erdős-Rado Theorem"
    authors:
      - James E. Baumgartner
      - András Hajnal
      - Stevo Todorčević
    id: "https://arxiv.org/abs/math/9311207"
    type: paper
    location: "Finite and Infinite Combinatorics in Sets and Logic (NATO ASI Series, Banff 1991), Kluwer, 1993, pp. 1-17 (Theorem 2.1 and open problems on p. 2)"
    relationship: other
    note: >-
      Primary source of open Parts (ii) and (iii) verbatim on p. 2 (strictly
      beyond Theorems 3.1 and 4.1 of the paper) and of the un-cropped original
      Part (i) GCH problem ω₃ → (ω₂ + 2)²_ω, which remains open. Theorem 2.1
      ((2^{<κ})⁺ → (κ + 1)²_μ for μ < κ, from Erdős-Rado) also entails the
      weaker partial step GCH → ω₃ → (ω₂ + 1)²_ω proved here via countable-color
      neighborhood ideals. Favorable-order ideas from this paper also inform
      background lemmas in Erdos1172/BHT*.lean. Recorded with relationship:
      other alongside type: original-proof. No endorsement is claimed.
  - title: "Some of Paul's favorite problems"
    contributors:
      - name: András Hajnal
        role: editor
      - name: Péter Komjáth
        role: editor
      - name: Béla Bollobás
        role: editor
    id: "https://web.math.pmf.unizg.hr/~vjekovac/EP/Some_of_Pauls_favorite_problems.pdf"
    type: other
    location: "Conference booklet for 'Paul Erdős and his mathematics', Budapest, July 1999, Section 7 (Set theory), items 7.86 and 7.87, p. 13"
    relationship: background
    note: >-
      1999 Budapest conference booklet (compiled by 18 editors, cited as [Va99]
      on erdosproblems.com) restating Baumgartner-Hajnal-Todorčević's open
      problems in item 7.87 and the all-α < ω₂ consistency question in item 7.86.
      Cropping at the right margin of p. 13 truncated ω₃ → (ω₂ + 2)²_ω after
      ω₃ → (ω₂; erdosproblems.com/1172's binary reconstruction is omitted from
      this formalization. No endorsement is claimed.
  - title: "A partition calculus in set theory"
    authors:
      - Paul Erdős
      - Richard Rado
    id: "https://doi.org/10.1090/S0002-9904-1956-10036-0"
    type: paper
    location: "Bulletin of the American Mathematical Society 62 (1956), 427-489"
    relationship: other
    note: >-
      Establishes (2^{<κ})⁺ → (κ + 1)²_μ for μ < κ (cited as BHT93 Theorem 2.1),
      which under GCH at κ = ω₂, μ = ω also entails the weaker countable-color
      partial step ω₃ → (ω₂ + 1)²_ω proved in
      Erdos1172/CountableNeighborhoodStep.lean via our neighborhood-ideal
      machinery, as well as background Erdős-Rado lemmas in
      Erdos1172/ForMathlib/SetTheory/Ordinal/. Recorded with relationship: other
      because type: original-proof is declared for Parts (ii)-(iii). No
      endorsement is claimed.
  - title: "Unsolved and solved problems in set theory"
    authors:
      - Paul Erdős
      - András Hajnal
    id: "https://users.renyi.hu/~p_erdos/1974-36.pdf"
    type: paper
    location: "Proceedings of the Tarski Symposium (Proc. Sympos. Pure Math., Vol. XXV), Amer. Math. Soc., 1974, pp. 269-287 (p. 272; MR0357122)"
    relationship: background
    note: >-
      Poses Part (iv) on p. 272 ("Is ω₂ → (ω₁ + ω)²₂ or even ω₂ → (ξ)²₂ for
      ξ < ω₂ consistent with G.C.H.?"), revising Problem 10/B of Erdős-Hajnal
      (1971) after Prikry (1972) and Hajnal proved ω₂ ↛ [ω₁ + ω]²_{ℵ₁} is
      consistent with GCH (and holds in L). No endorsement is claimed.
  - title: "An (ℵ₂, ℵ₂, ℵ₀)-saturated ideal on ω₁"
    authors:
      - Richard Laver
    id: "https://doi.org/10.1016/S0049-237X(08)71883-4"
    type: paper
    location: "Logic Colloquium '80, Studies in Logic and the Foundations of Mathematics 108, North-Holland, 1982, pp. 173-180"
    relationship: other
    note: >-
      Establishes relative to a huge cardinal the consistency with GCH of
      ω₂ → (ω₁ · 2 + 1, α)² for all α < ω₂, settling the ω₁ + ω consistency
      question of Erdős-Hajnal (1974, p. 272). Part (iv) of this submission
      provides the first machine-checked formalization of this consistency
      result for ω₂ → (ω₁ + ω)²₂, adapting huge-cardinal collapse and normal
      dense-ideal ideas into an anonymous Boolean-valued Lévy-Cohen collapse.
      Recorded with relationship: other because type: original-proof is
      declared for Parts (ii)-(iii). No endorsement is claimed.
  - title: "A partition relation for successors of large cardinals"
    authors:
      - Matthew Foreman
      - András Hajnal
    id: "https://doi.org/10.1007/s00208-002-0393-y"
    type: paper
    location: "Mathematische Annalen 325 (2003), no. 3, 583-623"
    relationship: other
    note: >-
      Strengthens Laver (1982) from a huge cardinal to consistency with GCH of
      ω₂ → (ω₁² + 1, α)² for all α < ω₂. Part (iv)'s internal normal dense-basis
      partition theorem and collapse architecture adapt ideas from Laver (1982),
      Foreman-Hajnal (2003), Kunen (1978), and Shioya. Recorded with
      relationship: other because type: original-proof is declared for Parts
      (ii)-(iii). No endorsement is claimed.
  - title: "The Higher Infinite: Large Cardinals in Set Theory from Their Beginnings"
    authors:
      - Akihiro Kanamori
    id: "https://doi.org/10.1007/978-3-540-88867-3"
    type: book
    location: "2nd ed., Springer Monographs in Mathematics, 2009, Section 24, Theorem 24.8"
    relationship: background
    note: >-
      Canonical [θ]^{ot = κ} ultrafilter characterization of huge cardinals
      formalized by IsHugeWithTarget and IsHugeCardinal. No endorsement is claimed.
  - title: "A formal proof of the independence of the continuum hypothesis"
    authors:
      - Jesse Michael Han
      - Floris van Doorn
    id: "https://doi.org/10.1145/3372885.3373826"
    type: paper
    location: "Proceedings of CPP 2020, ACM, pp. 353-366"
    relationship: background
    note: >-
      Describes the Flypitch first-order ZFC syntax, Boolean-valued model bSet,
      and Boolean soundness theorem adapted in vendor/flypitch4/. No endorsement
      is claimed.
  - title: "Erdős Problems, problem 1172"
    id: "https://www.erdosproblems.com/1172"
    type: other
    location: "Catalogue entry (last edited 2026-04-11, citing [ErHa74, p. 272] and [Va99, 7.87])"
    relationship: background
    note: >-
      Catalogue entry assembling Parts (ii)-(iv) from [Va99, 7.87] and
      [ErHa74, p. 272]. Its cropped-scan binary reconstruction of Part (i) is
      omitted here; the un-cropped [BHT93, p. 2] Part (i) question
      ω₃ → (ω₂ + 2)²_ω remains open. No endorsement by the catalogue or its
      editor is claimed.

