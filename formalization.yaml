    Erdos1172.erdos_1172.variants.part1_omega_two_add_one, and
    Erdos1172.erdos_1172.variants.parts_ii_iii_iv_and_part1_step: ZFC + GCH
    proofs of Parts (ii) and (iii) (matching BHT93 verbatim and previously open),
    syntactic consistency of ZFC + GCH + ω₂ → (ω₁ + ω, ω₁ + ω)² from a huge
    cardinal (formalizing the ω₁ + ω consistency result of Laver 1982 and
    Foreman-Hajnal 2003), and a ZFC + GCH proof of the weaker countable-color
    partial step ω₃ → (ω₂ + 1)²_ω toward the original BHT93 Part (i) via our
    countable-color neighborhood-ideal machinery (also entailed by Erdős-Rado /
    BHT93 Theorem 2.1). The original BHT93 Part (i) question ω₃ → (ω₂ + 2)²_ω
    under GCH and the stronger simultaneous ∀ ξ < ω₂, ω₂ → (ξ)²₂ consistency
    question (as well as large-cardinal optimality below huge) remain open and
    are not claimed; erdosproblems.com/1172's cropped-scan Part (i)
    reconstruction is omitted.
