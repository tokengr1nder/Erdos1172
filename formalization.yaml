automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        User-directed AI coding agents developed, refactored, audited, and
        documented Lean 4 proofs over Mathlib and Flypitch4.
      prompting_notes: >-
        The user specified exact target statements, zero custom axioms or proof
        holes, full first-order GCH and partition sentences without parameter
        shortcuts, primary-source historical verification, statement/axiom
        audits, and multi-kernel verification.
    - method: agent
      framework: "Claude / Gemini"
      tool_setup: >-
        Additional AI coding agents contributed proof compaction, Lean 4.35
        module-system porting, primary-source literature verification,
        faithfulness audits, and publication packaging.
    - method: manual
      tool_setup: >-
        Tokengrinder directed mathematical goals, architectural invariants,
        statement fidelity requirements, historical framing, and publication
        boundaries. This is not a claim of independent human line-by-line review.
  notes: >-
    AI involvement was substantive throughout proof development and packaging.
    Exact model versions, full prompt logs, and cost/time totals were not
    uniformly preserved. See PALOMAR.md.

fidelity:
  divergences: >-
    Parts (ii) and (iii) match Baumgartner-Hajnal-Todorčević (1993, p. 2),
    [Va99, 7.87], and erdosproblems.com/1172 verbatim under Cardinal.GCH (with
    universe-polymorphic Ordinal.{u} liftings also provided in Solution.lean and
    pair-coloring equivalence verified in audit/Statement.lean). Part (iv)
    formalizes syntactic consistency of ZFC + GCH + ω₂ → (ω₁ + ω, ω₁ + ω)²
    relative to a huge cardinal (IsHugeWithTarget κ θ plus ground tail GCH
    above θ, or Cardinal.GCH plus ∃ κ, IsHugeCardinal κ); the stronger
    ∀ ξ < ω₂, ω₂ → (ξ)²₂ question and large-cardinal optimality below huge are
    not addressed. For Part (i), erdosproblems.com/1172's cropped-scan binary
    reconstruction is omitted, and the original un-cropped BHT93 Part (i)
    question ω₃ → (ω₂ + 2)²_ω under GCH remains open; in its place
    erdos_1172.variants.part1_omega_two_add_one formalizes the weaker
    countable-color partial step GCH → ω₃ → (ω₂ + 1)²_ω proved by our
    countable-color neighborhood-ideal machinery (which also follows from
    Erdős-Rado / BHT93 Theorem 2.1, with [ω₃]² → ℕ order-embedding equivalence
    verified in audit/Statement.lean).

review:
  status: agent-reviewed
  notes: >-
    AI agents conducted separate primary-source checks, statement-fidelity
    audits, and axiom-hygiene reviews under user direction. This is not
    independent human expert peer review. Mechanical kernel verification is
    documented in VERIFICATION.md.

